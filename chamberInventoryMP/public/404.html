<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // Redirige cualquier 404 al index.html manteniendo la ruta original
      // para que el Router de React pueda leerla
      var pathSegmentsToKeep = 2; // Ajusta según la profundidad de tu URL
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
</html>
