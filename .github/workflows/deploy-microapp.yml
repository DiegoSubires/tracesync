name: Deploy Microapp
on:
  push:
    branches: [main]
    paths: ["chamberInventoryMP/**"] # Solo se ejecuta si cambia la microapp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        run: |
          cd chamberInventoryMP
          npm install
          npm run build
          # FORZAMOS LA COPIA AQUÍ:
          mkdir -p dist
          cp public/404.html dist/404.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./chamberInventoryMP/dist
          destination_dir: chamberInventoryMP
