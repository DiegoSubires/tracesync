name: Deploy TraceSync Hub
on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Build Projects
        run: |
          # Construir Hub (base: /tracesync/)
          cd tracesync-hub && npm install && npm run build && cd ..
          # Construir Microapp (base: /tracesync/chamberInventoryMP/)
          cd chamberInventoryMP && npm install && npm run build && cd ..

      - name: Prepare Final Structure
        run: |
          # Crear una carpeta raíz temporal
          mkdir -p public_final
          # Mover el Hub a la raíz
          cp -r tracesync-hub/dist/* public_final/
          # Mover la Microapp a su subcarpeta
          mkdir -p public_final/chamberInventoryMP
          cp -r chamberInventoryMP/dist/* public_final/chamberInventoryMP/

      - name: Deploy Everything Once
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_final
          force_orphan: true
