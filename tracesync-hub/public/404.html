<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Redireccionando...</title>
    <script>
      // Esto toma la ruta actual, la guarda en un parámetro y redirige al index
      var path = window.location.pathname;
      window.location.replace("/?redirect=" + path.substring(1));
    </script>
  </head>
  <body></body>
</html>
